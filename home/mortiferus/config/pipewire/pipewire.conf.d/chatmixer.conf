# /home/mortiferus/.config/pipewire/pipewire.conf.d/chatmixer.conf
# Dolby Atmos Convolver (atmos.wav) - 7.1 Virtual Surround via IR

context.modules = [
    # 1. SURROUND ENGINE 7.1 (Convolver mit Dolby Atmos IR, schneller als SOFA)
    { name = libpipewire-module-filter-chain
      flags = [ nofail ]
      args = {
          node.description = "Atmos DSP Engine"
          node.name = "AtmosFilter"
          filter.graph = {
              nodes = [
                  # Kopien der Eingangskanäle
                  { type = builtin label = copy name = copyFL }
                  { type = builtin label = copy name = copyFR }
                  { type = builtin label = copy name = copyFC }
                  { type = builtin label = copy name = copyRL }
                  { type = builtin label = copy name = copyRR }
                  { type = builtin label = copy name = copySL }
                  { type = builtin label = copy name = copySR }
                  { type = builtin label = copy name = copyLFE }

                  # Convolver: Dolby Atmos IR (14 Kanäle = 7 Positionen × 2 Ohren)
                  # Kanal-Mapping: 0/1=FL, 2/3=SL, 4/5=RL, 6/7=FC, 8/9=FR, 10/11=SR, 12/13=RR
                  { type = builtin label = convolver name = convFL_L config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 0 } }
                  { type = builtin label = convolver name = convFL_R config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 1 } }
                  { type = builtin label = convolver name = convSL_L config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 2 } }
                  { type = builtin label = convolver name = convSL_R config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 3 } }
                  { type = builtin label = convolver name = convRL_L config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 4 } }
                  { type = builtin label = convolver name = convRL_R config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 5 } }
                  { type = builtin label = convolver name = convFC_L config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 6 } }
                  { type = builtin label = convolver name = convFC_R config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 7 } }
                  { type = builtin label = convolver name = convFR_L config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 8 } }
                  { type = builtin label = convolver name = convFR_R config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 9 } }
                  { type = builtin label = convolver name = convSR_L config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 10 } }
                  { type = builtin label = convolver name = convSR_R config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 11 } }
                  { type = builtin label = convolver name = convRR_L config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 12 } }
                  { type = builtin label = convolver name = convRR_R config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/atmos.wav" channel = 13 } }

                  # Endmixer
                  { type = builtin label = mixer name = mixL }
                  { type = builtin label = mixer name = mixR }
              ]
              links = [
                  # Kopien → Convolver
                  { output = "copyFL:Out" input = "convFL_L:In" } { output = "copyFL:Out" input = "convFL_R:In" }
                  { output = "copySL:Out" input = "convSL_L:In" } { output = "copySL:Out" input = "convSL_R:In" }
                  { output = "copyRL:Out" input = "convRL_L:In" } { output = "copyRL:Out" input = "convRL_R:In" }
                  { output = "copyFC:Out" input = "convFC_L:In" } { output = "copyFC:Out" input = "convFC_R:In" }
                  { output = "copyFR:Out" input = "convFR_L:In" } { output = "copyFR:Out" input = "convFR_R:In" }
                  { output = "copySR:Out" input = "convSR_L:In" } { output = "copySR:Out" input = "convSR_R:In" }
                  { output = "copyRR:Out" input = "convRR_L:In" } { output = "copyRR:Out" input = "convRR_R:In" }

                  # Convolver → Mixer (7 Richtungen)
                  { output = "convFL_L:Out" input = "mixL:In 1" } { output = "convFL_R:Out" input = "mixR:In 1" }
                  { output = "convSL_L:Out" input = "mixL:In 2" } { output = "convSL_R:Out" input = "mixR:In 2" }
                  { output = "convRL_L:Out" input = "mixL:In 3" } { output = "convRL_R:Out" input = "mixR:In 3" }
                  { output = "convFC_L:Out" input = "mixL:In 4" } { output = "convFC_R:Out" input = "mixR:In 4" }
                  { output = "convFR_L:Out" input = "mixL:In 5" } { output = "convFR_R:Out" input = "mixR:In 5" }
                  { output = "convSR_L:Out" input = "mixL:In 6" } { output = "convSR_R:Out" input = "mixR:In 6" }
                  { output = "convRR_L:Out" input = "mixL:In 7" } { output = "convRR_R:Out" input = "mixR:In 7" }

                  # LFE direkt auf Mixer (keine Convolution für Bass)
                  { output = "copyLFE:Out" input = "mixL:In 8" } { output = "copyLFE:Out" input = "mixR:In 8" }
              ]
              inputs = [ "copyFL:In" "copyFR:In" "copyFC:In" "copyLFE:In" "copyRL:In" "copyRR:In" "copySL:In" "copySR:In" ]
              outputs = [ "mixL:Out" "mixR:Out" ]
          }
           capture.props = {
               node.name = "AtmosSink"
               media.class = "Audio/Sink"
               audio.channels = 8
               audio.position = [ FL FR FC LFE RL RR SL SR ]
               monitor.channel-volumes = false
           }
          playback.props = {
              node.target = "alsa_output.atlas_air_headset"
              node.passive = true
          }
      }
    }

    # 2. GAME SINK 7.1 (Loopback, damit Spiele 8 Kanäle sehen)
    { name = libpipewire-module-loopback
      args = {
          node.description = "Game Audio"
           capture.props = {
               node.name = "GameSink"
               media.class = "Audio/Sink"
               audio.channels = 8
               audio.position = [ FL FR FC LFE RL RR SL SR ]
           }
          playback.props = {
              node.target = "AtmosSink"
              node.passive = true
              audio.dont-reconnect = true
          }
      }
    }

       # 3. CHAT SINK mit HRTF + EQ + LADSPA Kompressor (präsent, verständlich, frontal)
       # Stereo-Kette mit expliziten L/R-Pfaden (analog AtmosFilter)
     { name = libpipewire-module-filter-chain
       args = {
           node.description = "Chat DSP Engine"
           node.name = "ChatFilter"
           filter.graph = {
               nodes = [
                   # Mixer: Stereo FL/FR → Mono (für HRTF-Spatializer)
                   { type = builtin label = mixer name = chatMixIn }
                   # HRTF: Mono → Stereo (frontal, leicht erhöht)
                   { type = sofa label = spatializer name = chatSpat
                      config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/KU100_dry.sofa" }
                     control = { "Azimuth" = 0.0 "Elevation" = 10.0 "Radius" = 100.0 } }
                    # EQ: Kein Boost — L und R getrennt
                    { type = builtin label = bq_peaking name = chatEQL
                      control = { "Freq" = 3000 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin label = bq_peaking name = chatEQR
                      control = { "Freq" = 3000 "Q" = 1.0 "Gain" = 0.0 } }
                     # LADSPA Kompressor: sc1 (Steve Harris Mono Compressor) — L und R getrennt
                     # Sanft: nur laute Spitzen greifen, natuerlicher Klang
                     { type = ladspa
                       name = chatCompL
                       plugin = "sc1_1425"
                       label = "sc1"
                       control = {
                         "Attack time (ms)" = 5.0
                         "Release time (ms)" = 200.0
                         "Threshold level (dB)" = -20.0
                         "Ratio (1:n)" = 2.0
                         "Knee radius (dB)" = 6.0
                         "Makeup gain (dB)" = 8.0
                        }
                      }
                      { type = ladspa
                        name = chatCompR
                        plugin = "sc1_1425"
                        label = "sc1"
                        control = {
                          "Attack time (ms)" = 5.0
                          "Release time (ms)" = 200.0
                          "Threshold level (dB)" = -20.0
                          "Ratio (1:n)" = 2.0
                          "Knee radius (dB)" = 6.0
                          "Makeup gain (dB)" = 8.0
                       }
                     }

                     # ChatMix-Gain: Discord lauter als Spiel (+5 dB)
                     { type = builtin label = mixer name = chatAmpL control = { "Gain 1" = 1.78 } }
                     { type = builtin label = mixer name = chatAmpR control = { "Gain 1" = 1.78 } }
                 ]
                  links = [
                      # Mono-Mixer → EQ L/R (HRTF spatializer bypassed)
                      { output = "chatMixIn:Out" input = "chatEQL:In" }
                      { output = "chatMixIn:Out" input = "chatEQR:In" }
                      # EQ → Kompressor L/R
                      { output = "chatEQL:Out" input = "chatCompL:Input" }
                      { output = "chatEQR:Out" input = "chatCompR:Input" }
                      # Kompressor → ChatMix-Gain (+6 dB)
                      { output = "chatCompL:Output" input = "chatAmpL:In 1" }
                      { output = "chatCompR:Output" input = "chatAmpR:In 1" }
                  ]
                   inputs  = [ "chatMixIn:In 1" "chatMixIn:In 2" ]
                   outputs = [ "chatAmpL:Out" "chatAmpR:Out" ]
           }
           capture.props = {
               node.name = "ChatSink"
               media.class = "Audio/Sink"
               audio.channels = 2
               audio.position = [ FL FR ]
           }
           playback.props = {
               node.target = "alsa_output.atlas_air_headset"
               node.passive = true
           }
       }
     }
]
