# GameDAC 5.1 Loopback: Wine/Proton sieht Standard-5.1-Device (FL FR FC LFE RL RR),
# PipeWire routet auf GameDAC Game-Output (AUX0-AUX5). Kein DSP, nur Channel-Rename.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
        node.description = "GameDAC 5.1"
        capture.props = {
            node.name = "gamedac-game-5.1"
            media.class = "Audio/Sink"
            audio.channels = 6
            audio.position = [ FL FR FC LFE RL RR ]
        }
        playback.props = {
            node.target = "alsa_output.usb-SteelSeries_SteelSeries_GameDAC_000000000000-00.pro-output-1"
            node.passive = true
            audio.channels = 6
            audio.position = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 ]
        }
    }
  }
]
