# /home/mortiferus/.config/pipewire/pipewire.conf.d/chatmixer.conf
# SADIE_D2 (KEMAR) - 7.1 Ground-Plane, kein EQ, -18dB

context.modules = [
    # 1. SURROUND ENGINE 7.1 (SOFA-Spatializer, wandelt 8 Kanäle per HRTF in Stereo um)
    { name = libpipewire-module-filter-chain
      flags = [ nofail ]
      args = {
          node.description = "Atmos DSP Engine"
          node.name = "AtmosFilter"
          filter.graph = {
              nodes = [
                   # Ground-Plane Spatializer (7.1 Standard)
                    { type = sofa label = spatializer name = spFL
                      config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/SADIE_D2.sofa" }
                      control = { "Azimuth" = 35.0 "Elevation" = 0.0 "Radius" = 100.0  } }
{ type = sofa label = spatializer name = spFR
                      config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/SADIE_D2.sofa" }
                      control = { "Azimuth" = 325.0 "Elevation" = 0.0 "Radius" = 100.0  } }
{ type = sofa label = spatializer name = spFC
                      config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/SADIE_D2.sofa" }
                      control = { "Azimuth" = 0.0 "Elevation" = 0.0 "Radius" = 100.0  } }
{ type = sofa label = spatializer name = spRL
                      config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/SADIE_D2.sofa" }
                      control = { "Azimuth" = 150.0 "Elevation" = 0.0 "Radius" = 100.0  } }
{ type = sofa label = spatializer name = spRR
                      config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/SADIE_D2.sofa" }
                      control = { "Azimuth" = 210.0 "Elevation" = 0.0 "Radius" = 100.0  } }
{ type = sofa label = spatializer name = spSL
                      config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/SADIE_D2.sofa" }
                      control = { "Azimuth" = 85.0 "Elevation" = 0.0 "Radius" = 100.0  } }
{ type = sofa label = spatializer name = spSR
                      config = { filename = "/home/mortiferus/.config/pipewire/hrir_hesuvi/SADIE_D2.sofa" }
                      control = { "Azimuth" = 275.0 "Elevation" = 0.0 "Radius" = 100.0  } }
                    # LFE direkt
                    { type = builtin label = copy name = copyLFE }
                     # Endmixer
                     { type = builtin label = mixer name = mixL }
                     { type = builtin label = mixer name = mixR }
                     # SADIE H3 Gain Compensation (-18 dB Breitband via linear)
                     { type = builtin label = linear name = gainCompL
                       control = { "Mult" = 0.1259 "Add" = 0.0 } }
                     { type = builtin label = linear name = gainCompR
                       control = { "Mult" = 0.1259 "Add" = 0.0 } }
              ]
              links = [
                   # Ground → Endmixer
                   { output = "spFL:Out L" input = "mixL:In 1" }
                   { output = "spFL:Out R" input = "mixR:In 1" }
                   { output = "spFR:Out L" input = "mixL:In 2" }
                   { output = "spFR:Out R" input = "mixR:In 2" }
                   { output = "spFC:Out L" input = "mixL:In 3" }
                   { output = "spFC:Out R" input = "mixR:In 3" }
                   { output = "spRL:Out L" input = "mixL:In 4" }
                   { output = "spRL:Out R" input = "mixR:In 4" }
                   { output = "spRR:Out L" input = "mixL:In 5" }
                   { output = "spRR:Out R" input = "mixR:In 5" }
                   { output = "spSL:Out L" input = "mixL:In 6" }
                   { output = "spSL:Out R" input = "mixR:In 6" }
                   { output = "spSR:Out L" input = "mixL:In 7" }
                   { output = "spSR:Out R" input = "mixR:In 7" }
                   { output = "copyLFE:Out" input = "mixL:In 8" }
                   { output = "copyLFE:Out" input = "mixR:In 8" }
                   # Endmixer → Gain Comp (kein EQ)
                   { output = "mixL:Out" input = "gainCompL:In" }
                   { output = "mixR:Out" input = "gainCompR:In" }
              ]
               inputs  = [ "spFL:In" "spFR:In" "spFC:In" "copyLFE:In" "spRL:In" "spRR:In" "spSL:In" "spSR:In" ]
               outputs = [ "gainCompL:Out" "gainCompR:Out" ]
          }
           capture.props = {
               node.name = "AtmosSink"
               media.class = "Audio/Sink"
               audio.channels = 8
               audio.position = [ FL FR FC LFE RL RR SL SR ]
               monitor.channel-volumes = false
           }
          playback.props = {
              node.target = "alsa_output.atlas_air_headset"
              node.passive = true
          }
      }
    }

    # 2. GAME SINK 7.1 (Loopback, damit Spiele 8 Kanäle sehen)
    { name = libpipewire-module-loopback
      args = {
          node.description = "Game Audio"
           capture.props = {
               node.name = "GameSink"
               media.class = "Audio/Sink"
               audio.channels = 8
               audio.position = [ FL FR FC LFE RL RR SL SR ]
           }
          playback.props = {
              node.target = "AtmosSink"
              node.passive = true
              audio.dont-reconnect = true
          }
      }
    }

    # 3. CHAT SINK (Stereo, direkt ans Headset)
    { name = libpipewire-module-loopback
      args = {
          node.description = "Chat Audio"
          capture.props = {
              node.name = "ChatSink"
              media.class = "Audio/Sink"
              audio.position = [ FL FR ]
          }
          playback.props = {
              node.target = "alsa_output.atlas_air_headset"
              node.passive = true
              audio.dont-reconnect = true
          }
      }
    }
]
