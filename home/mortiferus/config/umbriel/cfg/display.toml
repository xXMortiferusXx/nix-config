# Outputs – Übersetzung aus cfg/display.kdl
#
# WICHTIG: Der Block ist an den Konnektor-Namen gebunden, und der ändert sich
# mit dem treibenden GPU! Prüfen mit `umbriel workspaces` (zeigt "eDP-2: N") oder
# `journalctl --user -b | grep "Found connector"`.
#   - dGPU-only (nvidia)  -> eDP-1  (card1)
#   - PRIME-Hybrid (amdgpu) -> eDP-2  (card2)   <- aktuell, seit 2026-09-26
# Ein nicht passender Name wird still ignoriert (kein Fehler) — der komplette
# Block ist dann wirkungslos. Genau das ist am 2026-09-26 nach dem BIOS-Umstieg
# auf Hybrid passiert: workspaces, bit_depth und cyclic_workspaces waren weg,
# woraufhin die default_workspace-Regeln aus rules.toml ins Leere liefen
# ("numeric position beyond the current count selects the last workspace").
[output."eDP-2"]
mode = "1920x1080@165.010"
scale = 1.0
bit_depth = 10    # 10-bit-SDR-Rendering (gegen Banding); Umbriel fällt auf 8-bit zurück, falls der Ausgang es nicht kann.
vrr = "disabled"    # Kein globales VRR (flackerte auf Electron-Fenstern wie Zen).
                    # VRR aktiviert sich stattdessen nur per window_rule.vrr (Games/mpv in rules.toml).
workspaces = 4    # STATISCH, und das ist wichtig: regeln die Positionen fest, die
                  # rules.toml per default_workspace (1..4) adressiert. Ohne diesen
                  # Eintrag ist das Modell "dynamic" (anonym, wird beim Mappen
                  # erzeugt und beim Leerräumen wieder entfernt) — dann ist
                  # Position 3 zur Startzeit gar nicht vorhanden und die Regel
                  # trifft stattdessen den letzten Workspace.
cyclic_workspaces = true    # Workspace-Schritt wrappt am Ende: 4 → 1 (und 1 → 4) statt hart zu stoppen.
